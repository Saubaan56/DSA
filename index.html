  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <style>
      .red-button {
        
        background-color: red;
        color: white;
        border: none;
        
      }

      .yellow-button{
          background-color: yellow;
          border: none;
      }
      .cart{
        border: solid black 2px;
        background-color: yellow;

      }
      .buy{
        border: solid black 2px;
        background-color: orange;
      }
      
    </style>
  </head>
  <body>
   
    <button title="Good Job!" class="red-button"
    onclick="
    alert('Good Job!');
    ">
      Hello
    </button>
    <p>
      paragraph of <button class="yellow-button">Hello</button> text
    </p>
    <button class="cart">
      Add to cart
    </button>
    <button class="buy">
      Buy now
    </button>
    <script>
    
       alert('Welcome');

    
      console.log(2 + 2);
      console.log('some ' + 'text');
    </script>
  </body>
  </html>
